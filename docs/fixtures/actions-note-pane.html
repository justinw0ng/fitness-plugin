<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2026-08-08</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    :root {
      --background-modifier-border: #e0e0e0;
      --interactive-normal: #f2f3f5;
      --interactive-hover: #e9e9e9;
      --text-normal: #222222;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f6f6f6;
      color: var(--text-normal);
      font-family: "Noto Sans", "Noto Sans CJK TC", "Noto Sans SC",
        system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      padding: 28px 36px;
    }

    .note-pane {
      max-width: 920px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .tab-strip {
      display: flex;
      align-items: stretch;
      background: #fcfcfc;
      border-bottom: 1px solid #e0e0e0;
      min-height: 36px;
      padding: 0 8px;
    }

    .tab {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      margin-top: 6px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      color: var(--text-normal);
    }

    .note-body {
      padding: 28px 40px 36px;
    }

    .note-title {
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-normal);
    }

    .placeholder {
      margin: 8px 0 0;
      font-size: 13px;
      font-style: italic;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="note-pane">
    <div class="tab-strip">
      <div class="tab">2026-08-08</div>
    </div>
    <div class="note-body">
      <h1 class="note-title">2026-08-08 (Sat) ✨</h1>
      <!-- DOM mirrors src/views/actions.ts renderActions(); update both together -->
      <div class="fitness-plugin">
        <div class="fitness-actions">
          <button type="button">🏋️ Gym / 健身</button>
          <button type="button">⛳ Golf / 高爾夫</button>
        </div>
      </div>
      <p class="placeholder">…heatmap renders below…</p>
    </div>
  </div>
</body>
</html>

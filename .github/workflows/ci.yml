name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out PR head (works for fork PRs too) so same-repo branches can still be pushed to.
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main for version comparison
        run: git fetch origin main:refs/remotes/origin/main

      - name: Read main version
        id: main_version
        run: |
          set -euo pipefail
          MAIN_VERSION="$(git show origin/main:manifest.json | node -e "
            let s = '';
            process.stdin.on('data', (d) => { s += d; });
            process.stdin.on('end', () => {
              process.stdout.write(JSON.parse(s).version);
            });
          ")"
          echo "version=${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main version=${MAIN_VERSION}"

      - name: Ensure PR version is bumped
        id: ensure_version
        run: |
          set -euo pipefail
          MAIN_VERSION="${{ steps.main_version.outputs.version }}"
          SAME_REPO="${{ github.event.pull_request.head.repo.full_name == github.repository }}"

          if [ "${SAME_REPO}" != "true" ]; then
            echo "Fork PR detected; skipping auto version bump (conflict check still runs)."
            CURRENT="$(node scripts/bump-version.mjs)"
            echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEXT="$(node scripts/ensure-pr-version.mjs "${MAIN_VERSION}")"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- package.json package-lock.json manifest.json versions.json; then
            echo "Version files unchanged (${NEXT})."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore: bump version to ${NEXT}"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "Pushed version bump commit for ${NEXT}"

      - name: Check version conflict against main
        run: |
          set -euo pipefail
          node scripts/check-version-conflict.mjs "${{ steps.main_version.outputs.version }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: obsidian-fitness-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

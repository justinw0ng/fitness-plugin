name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect plugin changes
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Fetch PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check plugin source paths
        id: filter
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          mapfile -t SOURCE_PATHSPECS < <(
            grep -vE '^[[:space:]]*(#|$)' .github/plugin-source-paths.txt | sed 's|/\*\*$||'
          )
          SOURCE_CHANGED="$(git diff --name-only "${BASE}...HEAD" -- "${SOURCE_PATHSPECS[@]}")"
          CI_CHANGED="$(git diff --name-only "${BASE}...HEAD" -- \
            "${SOURCE_PATHSPECS[@]}" \
            tests \
            e2e \
            scripts/ensure-pr-version.mjs \
            scripts/check-version-conflict.mjs \
            scripts/bump-version.mjs \
            scripts/semver.mjs \
            .github/plugin-source-paths.txt \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/codeql.yml)"

          echo "Changed plugin source files:"
          if [ -z "${SOURCE_CHANGED}" ]; then
            echo "(none)"
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${SOURCE_CHANGED}"
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed CI-related files:"
          if [ -z "${CI_CHANGED}" ]; then
            echo "(none)"
            echo "plugin=false" >> "$GITHUB_OUTPUT"
            echo "No plugin source or test changes; skipping test and build."
          else
            printf '%s\n' "${CI_CHANGED}"
            echo "plugin=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Plugin test and build
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atomic-tracker-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  # Branch ruleset requires this exact check name on every PR.
  # Native on.paths would skip the workflow for docs-only PRs and block merge.
  # if: always() so a cancelled run still reports failure instead of a skipped required check.
  report:
    name: Test and build
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.result }}" = "cancelled" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "CI was cancelled."
            exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed (${{ needs.changes.result }})."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.plugin }}" = "true" ]; then
            if [ "${{ needs.build.result }}" != "success" ]; then
              echo "Plugin test and build did not succeed (${{ needs.build.result }})."
              exit 1
            fi
            echo "Plugin test and build succeeded."
            exit 0
          fi
          echo "No plugin source or test changes; skipped test and build."

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect plugin changes
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Fetch PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check plugin source paths
        id: filter
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          mapfile -t SOURCE_PATHSPECS < <(
            grep -vE '^[[:space:]]*(#|$)' .github/plugin-source-paths.txt | sed 's|/\*\*$||'
          )
          SOURCE_CHANGED="$(git diff --name-only "${BASE}...HEAD" -- "${SOURCE_PATHSPECS[@]}")"
          CI_CHANGED="$(git diff --name-only "${BASE}...HEAD" -- \
            "${SOURCE_PATHSPECS[@]}" \
            tests \
            e2e \
            scripts/ensure-pr-version.mjs \
            scripts/check-version-conflict.mjs \
            scripts/bump-version.mjs \
            scripts/semver.mjs \
            .github/plugin-source-paths.txt \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/codeql.yml)"

          echo "Changed plugin source files:"
          if [ -z "${SOURCE_CHANGED}" ]; then
            echo "(none)"
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${SOURCE_CHANGED}"
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed CI-related files:"
          if [ -z "${CI_CHANGED}" ]; then
            echo "(none)"
            echo "plugin=false" >> "$GITHUB_OUTPUT"
            echo "No plugin source or test changes; skipping test, build, and version bump."
          else
            printf '%s\n' "${CI_CHANGED}"
            echo "plugin=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Plugin test and build
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out PR head (works for fork PRs too) so same-repo branches can still be pushed to.
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main for version comparison
        if: needs.changes.outputs.source == 'true'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Read main version
        if: needs.changes.outputs.source == 'true'
        id: main_version
        run: |
          set -euo pipefail
          MAIN_VERSION="$(git show origin/main:manifest.json | node -e "
            let s = '';
            process.stdin.on('data', (d) => { s += d; });
            process.stdin.on('end', () => {
              process.stdout.write(JSON.parse(s).version);
            });
          ")"
          echo "version=${MAIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main version=${MAIN_VERSION}"

      - name: Ensure PR version is bumped
        if: needs.changes.outputs.source == 'true'
        id: ensure_version
        run: |
          set -euo pipefail
          MAIN_VERSION="${{ steps.main_version.outputs.version }}"
          SAME_REPO="${{ github.event.pull_request.head.repo.full_name == github.repository }}"

          if [ "${SAME_REPO}" != "true" ]; then
            echo "Fork PR detected; skipping auto version bump (conflict check still runs)."
            CURRENT="$(node scripts/bump-version.mjs)"
            echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEXT="$(node scripts/ensure-pr-version.mjs "${MAIN_VERSION}")"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- package.json package-lock.json manifest.json versions.json; then
            echo "Version files unchanged (${NEXT})."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore: bump version to ${NEXT}"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "Pushed version bump commit for ${NEXT}"

      - name: Check version conflict against main
        if: needs.changes.outputs.source == 'true'
        run: |
          set -euo pipefail
          node scripts/check-version-conflict.mjs "${{ steps.main_version.outputs.version }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atomic-tracker-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  # Branch ruleset requires this exact check name on every PR.
  # Native on.paths would skip the workflow for docs-only PRs and block merge.
  # if: always() so a cancelled run still reports failure instead of a skipped required check.
  report:
    name: Test and build
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.result }}" = "cancelled" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "CI was cancelled."
            exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed (${{ needs.changes.result }})."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.plugin }}" = "true" ]; then
            if [ "${{ needs.build.result }}" != "success" ]; then
              echo "Plugin test and build did not succeed (${{ needs.build.result }})."
              exit 1
            fi
            echo "Plugin test and build succeeded."
            exit 0
          fi
          echo "No plugin source or test changes; skipped test, build, and version bump."

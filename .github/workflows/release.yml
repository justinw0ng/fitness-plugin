name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      branch:
        description: Branch to release from
        type: string
        default: main
      release_notes:
        description: GitHub release notes (optional; auto-generated notes are appended)
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PLUGIN_ID: atomic-tracker

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          BUMP="${{ inputs.bump }}"
          if [[ "${BRANCH}" == refs/* ]]; then
            echo "Branch must be a branch name, not a refs/* path: ${BRANCH}"
            exit 1
          fi
          if ! git check-ref-format --branch "${BRANCH}"; then
            echo "Invalid branch name: ${BRANCH}"
            exit 1
          fi
          case "${BUMP}" in
            patch|minor|major) ;;
            *)
              echo "Invalid bump level: ${BUMP}"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump plugin version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node scripts/bump-version.mjs "${{ inputs.bump }}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${{ inputs.bump }} to ${VERSION} on ${{ inputs.branch }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure release tag is free
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; refusing to overwrite."
            exit 1
          fi

      - name: Commit version bump, tag, and push
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ inputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore: bump version to ${VERSION}"
          git tag "${VERSION}"
          git push origin "HEAD:${BRANCH}"
          git push origin "refs/tags/${VERSION}"

      - name: Package plugin zip
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PLUGIN_ID="${{ env.PLUGIN_ID }}"
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/${PLUGIN_ID}"
          cp main.js manifest.json styles.css "${STAGE}/${PLUGIN_ID}/"
          (
            cd "${STAGE}"
            zip -r "${ARCHIVE}" "${PLUGIN_ID}"
          )
          mv "${STAGE}/${ARCHIVE}" "./${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${ARCHIVE}"
          unzip -l "${ARCHIVE}"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release with plugin assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            ${{ steps.package.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

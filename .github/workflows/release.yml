name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: obsidian-fitness

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    # Avoid recursive releases when this workflow pushes a build commit.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node scripts/bump-version.mjs)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (version is set on the PR via CI)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure release tag is free
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; refusing to overwrite."
            echo "This usually means main was updated without bumping the plugin version above the last release."
            exit 1
          fi

      - name: Commit built assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "No build changes to commit (release will still be created)."
          else
            git commit -m "chore(release): ${VERSION}"
            git push origin HEAD:main
          fi
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Package plugin zip
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PLUGIN_ID="${{ env.PLUGIN_ID }}"
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/${PLUGIN_ID}"
          cp main.js manifest.json styles.css "${STAGE}/${PLUGIN_ID}/"
          (
            cd "${STAGE}"
            zip -r "${ARCHIVE}" "${PLUGIN_ID}"
          )
          mv "${STAGE}/${ARCHIVE}" "./${ARCHIVE}"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${ARCHIVE}"
          unzip -l "${ARCHIVE}"

      - name: Create GitHub Release with plugin zip
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
